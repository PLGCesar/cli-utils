name: Build Verification

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Environment (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          touch ~/.bashrc

      - name: Install Build Essentials (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc make

      - name: Set up MSYS2 MinGW (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make

      - name: Auto-Compile All Utilities
        shell: bash
        run: |
          echo "Scanning subdirectories for Makefiles..."
          found=0
          for dir in */; do
            if [ -f "${dir}Makefile" ]; then
              echo "--------------------------------------------------"
              echo "Building utility in folder: ${dir}"
              echo "--------------------------------------------------"
              (cd "$dir" && make clean && make)
              found=1
            fi
          done

          if [ -f "Makefile" ]; then
            echo "--------------------------------------------------"
            echo "Building root Makefile..."
            echo "--------------------------------------------------"
            make clean && make
            found=1
          fi

          if [ $found -eq 0 ]; then
            echo "[-] No Makefiles found in repository!"
            exit 1
          fi

      - name: Run Automated CLI Execution Tests
        shell: bash
        run: |
          echo "Executing CLI sanity checks..."

          # Test ip-info help
          if [ -f "ip-info/ip-info" ]; then ./ip-info/ip-info --help; fi
          if [ -f "ip-info/ip-info.exe" ]; then ./ip-info/ip-info.exe --help; fi

          # Test template list
          if [ -f "template/template" ]; then ./template/template -list; fi
          if [ -f "template/template.exe" ]; then ./template/template.exe -list; fi

          # Test shredder help
          if [ -f "shredder/shredder" ]; then ./shredder/shredder --help; fi
          if [ -f "shredder/shredder.exe" ]; then ./shredder/shredder.exe --help; fi

          # Test lit help
          if [ -f "lit/lit" ]; then ./lit/lit -help; fi
          if [ -f "lit/lit.exe" ]; then ./lit/lit.exe -help; fi

          echo "[✔] All CLI execution sanity checks passed!"
